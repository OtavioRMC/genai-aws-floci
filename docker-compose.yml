
services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_SERVICES_BEDROCK_RUNTIME_BACKEND: proxy
      FLOCI_SERVICES_BEDROCK_RUNTIME_PROXY_URL: http://ollama:11434/v1
      FLOCI_SERVICES_BEDROCK_RUNTIME_PROXY_DEFAULT_MODEL: qwen3:0.6b  
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - ollama

  floci-ui:
    image: floci/floci-ui:latest
    ports:
        - "4500:4500"
    environment:
        - FLOCI_ENDPOINT=http://floci:4566
    depends_on:
        - floci

  ollama:
    image: ollama/ollama:latest
    ports:
      - "1134:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
